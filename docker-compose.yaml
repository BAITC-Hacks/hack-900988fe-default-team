services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: problemly-backend:local
    env_file:
      - ./backend/.env
    ports:
      - "3388:3388"
    environment:
      PORT: "3388"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      secrets:
        - source: frontend_env
          target: frontend_env
    image: problemly-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5380:80"
    restart: unless-stopped

volumes:
  backend-data:

secrets:
  frontend_env:
    file: ./frontend/.env
